[package]
name = "ZM-LAMBDA-RMK"
version = "0.2.0"
authors = ["Alex Zidros"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/haobogu/rmk"
repository = "https://github.com/haobogu/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { git = "https://github.com/HaoboGu/rmk", rev = "bf9922b", features = [
    "async_matrix",
    "nrf52840_ble",
    "adafruit_bl",
] }
nrf-sdc = { git = "https://github.com/haobogu/nrf-sdc", rev = "ffe59a7aefaaa145a3d2474602f33387f80dcefa", features = [
    "defmt",
    "peripheral",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/haobogu/nrf-sdc", rev = "ffe59a7aefaaa145a3d2474602f33387f80dcefa", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.8", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }
embassy-nrf = { version = "0.10", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }
async-trait = "0.1.88"

## Custom Added Dependencies

smart-leds = "0.4"
ws2812-spi = { git = "https://github.com/aziddy/ws2812-spi-rs", branch = "nrf52840_at4Mhz_support" }

# For math functions (optional, for breathing effect)
libm = "0.2"


[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "ZM-LAMBDA-RMK"
test = false
bench = false

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"

# Local fork of RMK with USB descriptor buffer bumped from 128 -> 512 bytes.
# Upstream sizes the config descriptor buffer for keyboard + 1 extra HID; our
# vial+host build adds a third HID interface (host_rw) which overflows it.
[patch."https://github.com/HaoboGu/rmk"]
rmk = { path = "../rmk-zm-patch/rmk" }
rmk-config = { path = "../rmk-zm-patch/rmk-config" }
rmk-macro = { path = "../rmk-zm-patch/rmk-macro" }
rmk-types = { path = "../rmk-zm-patch/rmk-types" }
